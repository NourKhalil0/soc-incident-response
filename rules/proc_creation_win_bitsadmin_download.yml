title: Bitsadmin Ingress Job Transfer
id: 8b9c0d1e-2f3a-4b5c-6d7e-8f9a0b1c2d3e
status: stable
description: Detects bitsadmin.exe creating transfer jobs to download remote payload binaries
author: Nour Mo
references:
  - https://attack.mitre.org/techniques/T1197/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\bitsadmin.exe'
    CommandLine|contains:
      - '/transfer'
      - '/addfile'
  condition: selection
level: high
tags:
  - attack.defense_evasion
  - attack.t1197

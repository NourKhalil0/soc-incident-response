title: Suspicious PowerShell WebClient Download Cradles
id: d4f9c1b3-4f9e-4e3a-96df-71bc391f1b21
status: stable
description: Detects suspicious PowerShell commands invoking System.Net.WebClient download strings
author: Nour Mo
references:
  - https://attack.mitre.org/techniques/T1059/001/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'DownloadString'
      - 'DownloadFile'
      - 'Net.WebClient'
  condition: selection
fields:
  - CommandLine
  - ParentImage
level: high
tags:
  - attack.execution
  - attack.t1059.001

title: Volume Shadow Copy Deletion via Vssadmin
id: 3b4c5d6e-7f8a-9b0c-1d2e-3f4a5b6c7d8e
status: stable
description: Detects execution of vssadmin.exe to delete volume shadow copies
author: Nour Mo
references:
  - https://attack.mitre.org/techniques/T1490/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains:
      - 'delete'
      - 'shadows'
  condition: selection
level: critical
tags:
  - attack.impact
  - attack.t1490

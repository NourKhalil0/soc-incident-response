title: Mimikatz LSASS Process Memory Dump
id: 7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d
status: stable
description: Detects invocation of Mimikatz sekurlsa::logonpasswords to dump plaintext credentials
author: Nour Mo
references:
  - https://attack.mitre.org/techniques/T1003/001/
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'sekurlsa::logonpasswords'
      - 'lsadump::sam'
      - 'lsadump::dcsync'
  condition: selection
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
